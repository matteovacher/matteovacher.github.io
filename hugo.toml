baseURL = 'https://matteovacher.github.io/'
languageCode = 'en-us'
title = 'Mattéo Vacher'
theme = 'PaperMod'

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[params] 
    author = "Mattéo Vacher"
    description = "Simulation of ant colony and AI" 
    defaultTheme = 'auto'
    disableThemeToggle = false

    showToc = true
    TocOpen = false

    ShowBreadCrumbs = true
    ShowCodeCopyButton = true

    hideMeta = false 
    ShowReadingTime = true

    [params.homeInfoParams]
    enabled = false 
    content = "Hello, I am Mattéo Vacher"
    
    [params.profileMode]
    enabled = true 
    title = "Mattéo Vacher - Ants and AI"
    subtitle = "Dear Reader, here I explore ants collective intelligence through simulations at my scale and with my own equipment."
    imageUrl = "img/profil.jpg"
    imageWidth = 180 
    imageHeight = 180

    [params.assets]
    favicon = "img/profil.png"
    favicon16x16 = "img/profil.png"
    favicon32x32 = "img/profil.png"
    apple_touch_icon = "img/profil.png"

    [[params.socialIcons]]
        name = "email"
        url = "mailto:vachermatteo@gmail.com"
    


    [[params.socialIcons]]
        name = "linkedin"
        url = "https://www.linkedin.com/in/matteo-vacher/"

    [[params.socialIcons]]
        name = "github"
        url = "https://github.com/matteovacher"

    [[params.socialIcons]]
        name = "email"
        url = "mailto:matte.vacher@student.isae-supaero.fr"


