baseURL = 'https://matteovacher.github.io/'
languageCode = 'en-us'
title = 'Mattéo Vacher'
theme = 'PaperMod'
copyright = "© 2026 [Mattéo Vacher](/) · Icons from [Flaticon](https://www.flaticon.com/)"

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[params] 
    author = "Mattéo Vacher"
    description = "Simulation of ant colony and AI" 
    defaultTheme = 'auto'
    disableThemeToggle = false


    showToc = true
    TocOpen = false

    ShowBreadCrumbs = true
    ShowCodeCopyButtons = true

    hideMeta = false 
    ShowReadingTime = true

    ShowScrollToTopBtn = true
    ShowShareButtons = false 

    [params.homeInfoParams]
    enabled = false 
    content = "Hello, I am Mattéo Vacher"
    
    [params.profileMode]
    enabled = true 
    title = "Mattéo Vacher - Ants and AI"
    subtitle = "Dear Reader, here I explore ants collective intelligence through simulations at my scale and with my own equipment."
    imageUrl = "img/anthill.png"
    imageWidth = 180
    imageHeight = 180

    [params.assets]
        favicon = "img/favicon.ico"
        favicon16x16 = "img/favicon-16x16.png"
        favicon32x32 = "img/favicon-32x32.png"
        apple_touch_icon = "img/apple-touch-icon.png"

    [[params.socialIcons]]
        name = "email"
        url = "mailto:vachermatteo@gmail.com"


    [[params.socialIcons]]
        name = "linkedin"
        url = "https://www.linkedin.com/in/matteo-vacher/"

    [[params.socialIcons]]
        name = "github"
        url = "https://github.com/matteovacher"

    [[params.socialIcons]]
        name = "email"
        url = "mailto:matteo.vacher@student.isae-supaero.fr"

    [params.fuseOpts]
        isCaseSensitive = false
        shouldSort = true
        location = 0
        distance = 1000
        threshold = 0.4
        minMatchCharLength = 0
        keys = ["title", "permalink", "summary", "content"]

[menu]
    [[menu.main]]
        identifier = "home"
        name = "Home"
        url = "/"
        weight = 10

    [[menu.main]]
        identifier = "news"
        name = "News"
        url = "/posts/"
        weight = 20 

    # [[menu.main]]
    #     identifier = "projects"
    #     name = "Projects"
    #     url = "/projects/"
    #     weight = 30

    # [[menu.main]]
    #     identifier = "ressources"
    #     name = "Ressources" 
    #     url = "/ressources/"
    # weight = 40

    [[menu.main]]
        identifier = "search"
        name = "Search"
        url = "/search/"
        weight = 30

    [[menu.main]]
        identifier = "about"
        name = "About"
        url = "/about/"
        weight = 40

[outputs]
    home = ["HTML", "RSS", "JSON"]

